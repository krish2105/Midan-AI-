; Midan — engine configuration.
;
; This file holds PROJECT configuration, not tuning values. Anything a human
; would tune by feel belongs in a Data Asset (see CLAUDE.md).
;
; Phase 8 added starting-point values for the Virtual Shadow Map resolution
; bias, the Lumen trace distance clamp, and TSR history settings — engineering
; defaults, not claimed measurements. CLAUDE.md's measurement rule forbids
; stating a PERFORMANCE FIGURE that has not been measured (a table, a README,
; a commit message); it does not forbid a config file needing SOME value to
; run at all. Every one of these is marked UNMEASURED STARTING POINT below and
; must be confirmed or replaced once docs/PERFORMANCE_BUDGET.md has real
; numbers — see that document's status line, which stays "no measured numbers
; exist" until then regardless of what this file contains.

[/Script/EngineSettings.GameMapsSettings]
; GameDefaultMap and EditorStartupMap are set once the track map exists.
; See docs/MANUAL_STEPS.md Phase 1.


; ---------------------------------------------------------------------------
; PHYSICS — master prompt §1.3. Non-negotiable, and configured on day one
; because retrofitting substepping means fighting instability you built in.
;
; 120 Hz fixed async step. All vehicle force application happens in the async
; physics callback, never in Tick — force applied at frame rate against
; physics running at 120 Hz gives frame-rate-dependent handling.
; ---------------------------------------------------------------------------

[/Script/Engine.PhysicsSettings]
bSubstepping=True
MaxSubstepDeltaTime=0.008333
MaxSubsteps=6
bTickPhysicsAsync=True
AsyncFixedTimeStepSize=0.008333
DefaultDegreesOfFreedom=Full3D
bEnableEnhancedDeterminism=True

; Surface types. Read per-wheel by UVehicleSurfaceSensorComponent (Phase 3);
; each maps to a friction multiplier and an audio/FX row in
; USurfaceResponseDataAsset. Off-track detection samples these, never trigger
; volumes. Order is load-bearing — SurfaceTypeN indices are referenced by
; physical material assets, so append only, never reorder.
+PhysicalSurfaces=(Type=SurfaceType1,Name="Tarmac")
+PhysicalSurfaces=(Type=SurfaceType2,Name="Kerb")
+PhysicalSurfaces=(Type=SurfaceType3,Name="Gravel")
+PhysicalSurfaces=(Type=SurfaceType4,Name="Grass")
+PhysicalSurfaces=(Type=SurfaceType5,Name="Sand")
+PhysicalSurfaces=(Type=SurfaceType6,Name="Wet")


; ---------------------------------------------------------------------------
; RENDERING — the locked stack from CLAUDE.md.
; Lumen software tracing, Virtual Shadow Maps, TSR, Nanite, object motion blur.
; ---------------------------------------------------------------------------

[/Script/Engine.RendererSettings]
; Lumen for GI and reflections, SOFTWARE tracing as the default path.
; Software tracing is the locked default for broad compatibility and because
; it behaves better on a 3km streamed track. Hardware RT is an optional tier.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=0
r.RayTracing=False

; Software Lumen requires mesh distance fields.
r.GenerateMeshDistanceFields=True

; Virtual Shadow Maps.
r.Shadow.Virtual.Enable=1

; ResolutionLodBiasDirectional — Phase 8, docs/PERFORMANCE_BUDGET.md §6.1: Day
; is the VSM worst case (the only preset with a real sun and full directional
; cascade). UNMEASURED STARTING POINT, not a claimed result — CLAUDE.md's
; measurement rule forbids stating a figure that has not been measured, so
; this is an engineering default pending the Phase 8 gate's actual capture,
; not a performance claim. Raise (coarser, cheaper) if the Day-preset VSM
; line is over its <=1.5ms budget; lower if there is headroom to spend on
; contact-shadow sharpness instead.
r.Shadow.Virtual.ResolutionLodBiasDirectional=1.0

; Lumen trace distance clamp — docs/PERFORMANCE_BUDGET.md §6.1: clamp to the
; street width rather than leaving it at the engine default, since a
; low-roughness surface covering the whole play area (wet asphalt) is the
; worst possible input for a reflection tracer. UNMEASURED STARTING POINT —
; API VERIFY: exact cvar name/semantics for 5.8 software Lumen's max trace
; distance are unconfirmed without an installed engine.
r.Lumen.MaxTraceDistance=6000.0

; TSR history settings — Phase 8, docs/ARCHITECTURE.md §7: verify no wheel
; ghosting at speed before locking these. UNMEASURED STARTING POINTS.
r.TSR.History.ScreenPercentage=200
r.TSR.History.SampleCount=8
r.TSR.ShadingRejection.Flickering=1

; TSR, not TAA and not FSR. Its history rejection handles high-velocity screen
; movement better, which matters at 250km/h. Wheel ghosting is the classic
; racing-game artefact — Phase 8 verifies there is none at speed.
r.AntiAliasingMethod=4

; Velocity in the base pass gives TSR better motion vectors on moving geometry.
r.VelocityOutputPass=1

; Nanite for static geometry. Not vehicles, not translucency.
r.Nanite.ProjectEnabled=True

; Motion blur is a speed-feel system as much as a rendering one. Object blur
; on, camera blur low. Intensity is exposed in settings at Phase 7 — some
; players dislike it and some need it off for motion sensitivity.
r.DefaultFeature.MotionBlur=True
r.MotionBlurQuality=4

; Auto-exposure defaults on, but ART_DIRECTION §6 requires it heavily clamped
; in the post-process volume — hunting exposure on a moving camera destroys
; the golden-hour look. That clamp is authored on the volume, not here.
r.DefaultFeature.AutoExposure=True

; Skeletal mesh velocity for the vehicles.
r.SkinCache.CompileShaders=True


[/Script/Engine.Engine]
; GameUserSettingsClassName is set to UMidanGameUserSettings at Phase 7.


