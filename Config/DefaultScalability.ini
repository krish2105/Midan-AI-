; Midan — scalability tiers.
;
; Four tiers (0=Low, 1=Medium, 2=High, 3=Epic), authored at Phase 8.
;
; UNMEASURED STARTING POINTS, not claimed performance results — CLAUDE.md's
; measurement rule forbids stating a PERFORMANCE FIGURE that has not been
; measured; it does not forbid a scalability tier needing SOME value to exist
; before the Phase 8 gate's actual hardware run tunes it. Tier 3 (Epic) is the
; one docs/PERFORMANCE_BUDGET.md's 1080p/60fps budget targets — every number
; below is a hypothesis the gate confirms or corrects, not a settled result.
; docs/PERFORMANCE_BUDGET.md's own status line stays "no measured numbers
; exist" until the gate actually runs, regardless of what this file contains.
;
; Constraints from docs/PERFORMANCE_BUDGET.md respected below:
;
;   - Lumen Scene Detail and Final Gather Quality are set PER TIER (both
;     under GlobalIlluminationQuality), never globally.
;   - The cut order when over budget is fixed: volumetric clouds -> Lumen
;     reflection quality -> VSM resolution -> screen percentage -> foliage
;     density. Lower tiers cut in that order, not arbitrarily.
;   - Film grain, the exposure clamp, and motion blur are IDENTICAL across
;     all four tiers — see PostProcessQuality below. They are feel, not
;     fidelity, and are never scaled down.
;   - Tier 3 must hold the 1080p/60 budget; tiers 0-2 exist below it.

[ScalabilitySettings]

; --- View distance ----------------------------------------------------

[ViewDistanceQuality@0]
r.ViewDistanceScale=0.5
[ViewDistanceQuality@1]
r.ViewDistanceScale=0.7
[ViewDistanceQuality@2]
r.ViewDistanceScale=0.85
[ViewDistanceQuality@3]
r.ViewDistanceScale=1.0

; --- Anti-aliasing / TSR screen percentage -----------------------------
; Cut order step 4 (screen percentage) lands here — lower tiers render at a
; lower internal resolution before TSR upscales, which is the cheapest single
; lever this project has (docs/PERFORMANCE_BUDGET.md §5).

[AntiAliasingQuality@0]
r.TSR.ScreenPercentage=60
[AntiAliasingQuality@1]
r.TSR.ScreenPercentage=67
[AntiAliasingQuality@2]
r.TSR.ScreenPercentage=77
[AntiAliasingQuality@3]
r.TSR.ScreenPercentage=100

; --- Shadows / Virtual Shadow Maps --------------------------------------
; Cut order step 3 (VSM resolution) — ResolutionLodBiasDirectional coarsens
; per tier. See DefaultEngine.ini's own copy of the Epic-tier default; this
; overrides it per level.

[ShadowQuality@0]
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=3.0
[ShadowQuality@1]
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=2.0
[ShadowQuality@2]
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=1.5
[ShadowQuality@3]
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=1.0

; --- Global illumination (Lumen) ----------------------------------------
; Scene Detail and Final Gather Quality set HERE, per tier, never globally —
; docs/PERFORMANCE_BUDGET.md §7's explicit rule.

[GlobalIlluminationQuality@0]
r.Lumen.DiffuseIndirect.Allow=1
r.LumenScene.Detail=0.5
r.Lumen.FinalGather.Quality=0.5
[GlobalIlluminationQuality@1]
r.Lumen.DiffuseIndirect.Allow=1
r.LumenScene.Detail=0.75
r.Lumen.FinalGather.Quality=0.75
[GlobalIlluminationQuality@2]
r.Lumen.DiffuseIndirect.Allow=1
r.LumenScene.Detail=1.0
r.Lumen.FinalGather.Quality=1.0
[GlobalIlluminationQuality@3]
r.Lumen.DiffuseIndirect.Allow=1
r.LumenScene.Detail=1.0
r.Lumen.FinalGather.Quality=1.25

; --- Reflections (Lumen) -------------------------------------------------
; Cut order step 2 (reflection QUALITY, never wetness itself — see
; docs/PERFORMANCE_BUDGET.md §6.1).

[ReflectionQuality@0]
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.Quality=0.5
[ReflectionQuality@1]
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.Quality=0.75
[ReflectionQuality@2]
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.Quality=1.0
[ReflectionQuality@3]
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.Quality=1.25

; --- Post-process ---------------------------------------------------------
; Film grain, the exposure clamp, and motion blur are IDENTICAL at every
; tier — CLAUDE.md / PERFORMANCE_BUDGET.md §5: "never cut film grain, the
; exposure clamp, or motion blur. Those are feel, not fidelity." Only bloom
; and ambient occlusion quality scale down.

[PostProcessQuality@0]
r.MotionBlurQuality=4
r.BloomQuality=1
r.AmbientOcclusionLevels=0
r.Tonemapper.GrainQuantization=1
[PostProcessQuality@1]
r.MotionBlurQuality=4
r.BloomQuality=3
r.AmbientOcclusionLevels=1
r.Tonemapper.GrainQuantization=1
[PostProcessQuality@2]
r.MotionBlurQuality=4
r.BloomQuality=4
r.AmbientOcclusionLevels=2
r.Tonemapper.GrainQuantization=1
[PostProcessQuality@3]
r.MotionBlurQuality=4
r.BloomQuality=5
r.AmbientOcclusionLevels=3
r.Tonemapper.GrainQuantization=1

; --- Textures ---------------------------------------------------------

[TextureQuality@0]
r.Streaming.MipBias=2
r.MaxAnisotropy=2
[TextureQuality@1]
r.Streaming.MipBias=1
r.MaxAnisotropy=4
[TextureQuality@2]
r.Streaming.MipBias=0
r.MaxAnisotropy=8
[TextureQuality@3]
r.Streaming.MipBias=0
r.MaxAnisotropy=16

; --- Effects (Niagara: tyre smoke, exhaust backfire, rain) ---------------

[EffectsQuality@0]
r.NiagaraQualityLevel=0
fx.Niagara.QualityLevel=0
[EffectsQuality@1]
r.NiagaraQualityLevel=1
fx.Niagara.QualityLevel=1
[EffectsQuality@2]
r.NiagaraQualityLevel=2
fx.Niagara.QualityLevel=2
[EffectsQuality@3]
r.NiagaraQualityLevel=3
fx.Niagara.QualityLevel=3

; --- Foliage (PCG street furniture, roadside scatter) --------------------
; Cut order step 5 — the last thing to go before touching the four items
; above it.

[FoliageQuality@0]
foliage.DensityScale=0.4
[FoliageQuality@1]
foliage.DensityScale=0.6
[FoliageQuality@2]
foliage.DensityScale=0.85
[FoliageQuality@3]
foliage.DensityScale=1.0

; --- Shading (Nanite, base pass) -----------------------------------------

[ShadingQuality@0]
r.Nanite.MaxPixelsPerEdge=4.0
[ShadingQuality@1]
r.Nanite.MaxPixelsPerEdge=2.0
[ShadingQuality@2]
r.Nanite.MaxPixelsPerEdge=1.5
[ShadingQuality@3]
r.Nanite.MaxPixelsPerEdge=1.0
