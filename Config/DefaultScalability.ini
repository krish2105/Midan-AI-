; Midan — scalability tiers.
;
; DELIBERATELY EMPTY OF VALUES AT PHASE 1.
;
; Four tiers are authored at Phase 8, after measurement. Writing tier values
; now would mean inventing numbers, and CLAUDE.md's measurement rule forbids
; stating a performance figure that has not been measured — a scalability tier
; is exactly such a figure, since each level is a claim about what fits the
; frame budget.
;
; With no groups defined here, the engine falls back to BaseScalability.ini,
; which is correct and safe until Phase 8 replaces it.
;
; Phase 8 will author these groups at levels 0-3:
;
;   [ViewDistanceQuality@0..3]
;   [AntiAliasingQuality@0..3]        ; TSR screen percentage per tier
;   [ShadowQuality@0..3]              ; incl. r.Shadow.Virtual.ResolutionLodBiasDirectional
;   [GlobalIlluminationQuality@0..3]  ; Lumen Scene Detail + Final Gather, per tier not global
;   [ReflectionQuality@0..3]
;   [PostProcessQuality@0..3]
;   [TextureQuality@0..3]
;   [EffectsQuality@0..3]
;   [FoliageQuality@0..3]
;   [ShadingQuality@0..3]
;
; Constraints Phase 8 must respect, from docs/PERFORMANCE_BUDGET.md:
;
;   - Lumen Scene Detail and Final Gather Quality are set PER TIER, never
;     globally. A global setting wastes the low tiers.
;   - The cut order when over budget is fixed: volumetric clouds -> Lumen
;     reflection quality -> VSM resolution -> screen percentage -> foliage
;     density.
;   - Film grain, the exposure clamp, and motion blur are never cut at any
;     tier. They are feel, not fidelity.
;   - Tier 3 must hold the 1080p/60 budget. Tiers 0-2 exist below it, and the
;     120fps scalability path sits above.
;
; A benchmark-driven auto-detect on first run is wired at Phase 7 through
; UMidanGameUserSettings.

[ScalabilitySettings]
; Intentionally blank. See above.
