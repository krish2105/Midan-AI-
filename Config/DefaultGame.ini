; Primary asset types. Every tuning Data Asset derives from UMidanDataAsset, so
; the asset manager can scan all of them in one pass and CI can fail on a bad
; asset via -run=DataValidation without loading a level.
;
; The directories do not exist until content is authored; a missing scan
; directory is a harmless warning, not an error.
[/Script/Engine.AssetManagerSettings]
bOnlyCookProductionAssets=False
+PrimaryAssetTypesToScan=(PrimaryAssetType="MidanVehicle",AssetBaseClass=/Script/MidanVehicle.VehicleSetupDataAsset,bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Midan/Vehicles")),SpecificAssets=,Rules=(Priority=1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
+PrimaryAssetTypesToScan=(PrimaryAssetType="MidanVehicleFeel",AssetBaseClass=/Script/MidanVehicle.VehicleFeelDataAsset,bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Midan/Vehicles")),SpecificAssets=,Rules=(Priority=1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
+PrimaryAssetTypesToScan=(PrimaryAssetType="MidanSurfaceResponse",AssetBaseClass=/Script/MidanVehicle.SurfaceResponseDataAsset,bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Midan/Surfaces")),SpecificAssets=,Rules=(Priority=1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))

[/Script/GameplayTags.GameplayTagsSettings]
; Native tags are declared in C++ (MidanGameplayTags.h, Phase 3), never
; constructed from string literals at a call site. No .ini tag list is used —
; a tag that is not in C++ is not a tag this project recognises.
ImportTagsFromConfig=True
WarnOnInvalidTags=True
FastReplication=False
