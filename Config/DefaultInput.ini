; Midan — input configuration.
;
; Enhanced Input only. No legacy action or axis mappings are declared here: the
; input actions and mapping context are UAsset files authored in the editor
; (see docs/MANUAL_STEPS.md Phase 1 for the exact asset names) and referenced
; from UMidanInputConfigDataAsset as TSoftObjectPtr at Phase 3.
;
; Input SHAPING — steering curve, keyboard shaping curve, rise/fall rates —
; is not configured here either. Those are tuning values and live in
; FVehicleSteeringConfig on the vehicle Data Asset. Raw input is never mapped
; directly to steer angle; see .claude/skills/vehicle-physics-tuning §7.

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bAltEnterTogglesFullscreen=True
bUseMouseForTouch=False
bEnableMouseSmoothing=False
bViewAccelerationEnabled=False
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture

; Gamepad analogue deadzones. These are hardware compensation, not feel tuning
; — trigger and stick centre drift varies by controller. Vehicle input response
; shaping happens in the Data Asset curves, not here.
+AxisConfig=(AxisKeyName="Gamepad_LeftX",AxisProperties=(DeadZone=0.15,Sensitivity=1.0,Exponent=1.0,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_LeftY",AxisProperties=(DeadZone=0.15,Sensitivity=1.0,Exponent=1.0,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_RightX",AxisProperties=(DeadZone=0.20,Sensitivity=1.0,Exponent=1.0,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_RightY",AxisProperties=(DeadZone=0.20,Sensitivity=1.0,Exponent=1.0,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_LeftTriggerAxis",AxisProperties=(DeadZone=0.02,Sensitivity=1.0,Exponent=1.0,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_RightTriggerAxis",AxisProperties=(DeadZone=0.02,Sensitivity=1.0,Exponent=1.0,bInvert=False))
